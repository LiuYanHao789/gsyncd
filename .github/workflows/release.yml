name: release

# Builds the six static binaries and attaches them (plus SHA256SUMS) to a
# GitHub release when a tag like v0.1.0 is pushed. The same matrix runs on
# every push so a broken cross-build is caught before tagging.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./... -count=1
      - run: bash scripts/e2e.sh

  dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Cross-compile
        # A tag push carries the release version (v0.1.22 -> 0.1.22); a branch
        # push does not, and the tag-stripping expansion would stamp the branch
        # name ("main") into the binaries, so leave VERSION empty there and let
        # dist.sh fall back to its own default.
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)            VERSION="" ;;
          esac
          VERSION="$VERSION" bash scripts/dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gsyncd-binaries
          path: |
            dist/gsyncd-*
            dist/SHA256SUMS
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gsyncd-*
            dist/SHA256SUMS
          generate_release_notes: true
