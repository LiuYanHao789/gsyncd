# 安装为 /etc/tmpfiles.d/gsyncd.conf（本文件在仓库里叫 gsyncd.tmpfiles.conf，
# 是为了和 deploy/ 下其他文件区分，装过去时请改名）。
# 安装到 /etc/tmpfiles.d/gsyncd.conf 后执行 systemd-tmpfiles --create。
# 这里同时创建 /var/lib/gsyncd 与 /var/log/gsyncd。
# 注意：systemd 219（Anolis/CentOS 7）不支持 StateDirectory=，
# 所以不要依赖 unit 里的 StateDirectory，使用本文件或 unit 的 ExecStartPre。
# 类型 路径                  权限 属主 属组 年龄 参数
d /var/lib/gsyncd          0750 root root -   -
d /var/log/gsyncd          0750 root root -   -
