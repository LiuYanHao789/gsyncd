# 安装为 /etc/tmpfiles.d/gsyncd.conf（本文件在仓库里叫 gsyncd.tmpfiles.conf，
# 是为了和 deploy/ 下其他文件区分，装过去时请改名）。
# 可选：仅当 TOML 使用默认的 /var/lib/gsyncd 与 /var/log/gsyncd 时安装。
# 路径以 TOML 的 log_file/status_file/pid_file/checkpoint 为准；gsyncd 会
# 自动创建 log/status/pid 的父目录。安装到 /etc/tmpfiles.d/gsyncd.conf 后
# 执行 systemd-tmpfiles --create。
# systemd 219（Anolis/CentOS 7）不支持 StateDirectory=，本文件可替代它。
# 类型 路径                  权限 属主 属组 年龄 参数
d /var/lib/gsyncd          0750 root root -   -
d /var/log/gsyncd          0750 root root -   -
