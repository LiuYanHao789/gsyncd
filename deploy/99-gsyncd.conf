# ============================================================================
#  /etc/sysctl.d/99-gsyncd.conf
#  面向「单机盯 10T 级目录树」的调优。改完执行：
#      sysctl --system
#  验证：
#      sysctl fs.inotify.max_user_watches fs.inotify.max_user_instances \
#             fs.inotify.max_queued_events
# ============================================================================

# ---------------------------------------------------------------------------
# 1. inotify —— 10T 场景下唯一真正的硬墙
# ---------------------------------------------------------------------------
# 每个被监视的目录 = 内核里 1 个 watch，约 100 字节且**不可换出**(不参与 swap、
# 不参与 page cache 回收)。网上流传的「每 watch 约 1KB」把 watch 顺带 pin 住的
# inode/dentry 也算进去了，那部分是可回收的；只有 watch 结构本身是硬占用。
# 本机实测两次差分：97 B 与 115 B（gsyncd 的 cmd/probemark，DESIGN §6.2）。
#
# 估算公式：目录数 = 文件总数 / 平均每目录文件数
#   10T / 平均 1MB 文件        = 1000 万文件
#   1000 万 / 每目录 100 个文件 = 10 万目录 → 至少 10 万 watch（约 10MB 内核内存）
#   10T / 平均 100KB 文件       = 1 亿文件 → 100 万目录 → 100 万 watch（约 100MB）
#
# 默认 8192（Debian/Ubuntu 是 524288）远远不够，装不下时 gsyncd 不会崩，
# 而是把装不下的目录计入 unwatched 并自动每小时全量重扫 —— 但那是兜底，
# 应当尽量避免。先量一下再设：
#     find /srv/data -type d | wc -l
# 然后把结果乘以 1.2 的余量。
fs.inotify.max_user_watches = 2097152

# 每个用户的 inotify 实例数上限。gsyncd 只用 1 个实例(所有 watch 挂在同一个
# inotify fd 上)，默认 128 完全够；这里不动，列出来只是为了说明它不是瓶颈。
# fs.inotify.max_user_instances = 128

# 事件队列长度（每个实例）。默认 16384。**这是大目录树最容易踩的一条**：
# 一次 "rm -rf 一个 20 万文件的目录" 会在几秒内产生 20 万条事件，
# 队列一满内核就丢事件并只给你一个 IN_Q_OVERFLOW。
#
# gsyncd 对 IN_Q_OVERFLOW 的处理是「不重启、不丢一致性」——把该 sync 标记成
# 需要一次全量重传。在 10T 树上，一次全量是小时级，所以宁可把队列开大：
#     262144 条 ≈ 峰值 64~80MB 内核内存（每条事件约 250~300 字节，不可换出）
# 如果你会做「整棵子树 mv / 大批量 rm」，就再加一档到 1048576(≈300MB)。
# 反过来，如果机器内存紧张，宁可保持 16384 接受偶发全量，也不要抢内存。
fs.inotify.max_queued_events = 262144

# ---------------------------------------------------------------------------
# 2. 脏页回写 —— 决定 direct 后端拷 10T 时的吞吐曲线
# ---------------------------------------------------------------------------
# gsyncd 的 direct 后端是「读源 → 写目标 → 可选 fsync」。写进去的数据先进
# page cache，什么时候落盘由内核决定。默认 dirty_ratio=20%:
# 一台 128GB 内存的机器可以累积 25GB 脏页，然后在某一刻集中回写，
# 表现为「拷贝突然停住几十秒」，同时把读请求也一起拖慢。
#
# 下面这组把回写改成「更早开始、更平缓」，用一点吞吐换稳定的延迟。
# 若目标盘是 NVMe 且内存充足，可以不动；若是机械阵列 / 网络存储，建议设。
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
# 更精确的做法是按绝对字节设（优先于上面的比例，两者取小）：
# 例如 4GB 后台开始回写、8GB 强制阻塞写：
# vm.dirty_background_bytes = 4294967296
# vm.dirty_bytes = 8589934592

# 目录项/inode 缓存回收压力。10T 树会缓存大量 dentry，默认 100 比较激进地回收；
# 备份/镜像这类「反复 stat 同一批路径」的负载，调低到 50 能明显提高二次扫描命中率
# （代价是更多内存被 dentry 占用）。
vm.vfs_cache_pressure = 50

# 扫描型负载几乎不该 swap。gsyncd 自身内存占用很小（见 max_pending），
# 设 10 是为了防止内核把 dentry 挤出去换入无用的匿名页。
vm.swappiness = 10

# ---------------------------------------------------------------------------
# 3. 文件句柄与进程数
# ---------------------------------------------------------------------------
# gsyncd 本身占的 fd 很少（16 个并发拷贝 × 3 + inotify + 日志）。
# 但每个 sync 的首次全量、以及 rsyncssh 模式的 ssh 子进程都会叠加。
# 这条是给整机用的，不只是给 gsyncd。
fs.file-max = 2097152
fs.nr_open = 2097152

# ---------------------------------------------------------------------------
# 4. 仅 rsyncssh（跨公网/WAN）才需要调的网络参数
# ---------------------------------------------------------------------------
# 高带宽高延迟链路上，默认的 TCP 窗口撑不满 BDP。示例：1Gbps × 30ms RTT
# 需要约 3.75MB 的窗口。
# net.core.rmem_max = 33554432
# net.core.wmem_max = 33554432
# net.ipv4.tcp_rmem = 4096 87380 33554432
# net.ipv4.tcp_wmem = 4096 65536 33554432
# net.ipv4.tcp_congestion_control = bbr
# net.core.default_qdisc = fq

# ---------------------------------------------------------------------------
# 5. 不建议改的
# ---------------------------------------------------------------------------
# * vm.overcommit_memory=1 —— 它和同步速度无关，只是把内核对 mmap/brk 的额度检查
#   关掉：任何进程都能申请到远超物理内存的地址空间，代价是把「申请时失败」推迟成
#   「真正写入时被 OOM kill」。gsyncd 自己不需要它（Go 的堆有 memory_limit 兜着）。
#   反过来要注意：若机器上已经设了 overcommit_memory=2（严格模式），Go 运行时预留的
#   虚拟地址空间可能让 gsyncd 起不来，那种情况下才需要放宽 overcommit_ratio 或改成 1。
# * fs.inotify.max_user_watches 设成天文数字（比如 1 亿）—— 那会增加内核在
#   内存压力下遍历 mark 表的工作量，也可能让 dentry/inode 缓存占满可回收内存。
#   按 目录数 × 1.2 来设就够了。
