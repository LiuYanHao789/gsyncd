# ============================================================================
#  gsyncd 生产配置示例（TOML）
#  放置位置建议：/etc/gsyncd/gsyncd.toml      权限：0640 root:root
#  自检：        gsyncd -config /etc/gsyncd/gsyncd.toml -check
#  前台调试：    gsyncd -config /etc/gsyncd/gsyncd.toml -nodaemon -loglevel debug
#
#  ！！ 注意：内置 TOML 解析器只支持常用子集 ！！
#     - 支持：[table]、[[table]]、[table.sub]、基本类型、字符串、数组（含多行数组）、
#             # 注释、'单引号'与"双引号"字符串。
#     - 不支持：多行字符串（"""..."""）、十六进制/八进制整数、日期时间字面量、
#               表头之外的 dotted key（如 a.b = 1 这种散写）、[[array.of.tables]] 的深层数组。
#     - 数组可以换行：
#           excludes = [
#             "*.tmp",        # 行尾注释也可以
#             "/cache/",
#           ]
# ============================================================================
#
#  gsyncd 只解析数据，不执行代码。配置是纯数据 TOML，不会像 lsyncd 那样
#  被当成 Lua 执行，因此不支持 if / for / 变量。
#
#  拼错键名会直接报错退出（有意为之：静默忽略拼写错误比启动失败更危险）：
#      $ gsyncd -config x.toml -check
#      gsyncd: x.toml: global: unknown key "loglevl"
#
#  时长类参数统一规则：写字符串按 Go duration 解析("500ms" / "15s" / "10m" /
#  "1h")，写纯数字则按秒解释。两种写法等价：delay = 15  等价于  delay = "15s"
#
# ============================================================================
#  [global] —— 进程级设置，所有 sync 共享
# ============================================================================
[global]

# 日志文件路径。留空 = 写 stderr（systemd 下即 journald，生产推荐这种）。
# 注意：一旦写了文件，日志就不再进 journald，排障要去看文件。
# log_file = "/var/log/gsyncd/gsyncd.log"

# 日志级别：debug | info（默认，也接受 normal）| warn（也接受 scarce）| error | none
#   debug —— 每个被排除的路径、rsync 每行输出、每次 rename 都打。仅排障时临时开。
#   info  —— 启动、初始同步耗时、每批改了多少文件。生产默认。
#   warn  —— 只留异常（watch 装不下、重试、失败）。长期跑的大集群建议用它。
log_level = "info"

# 日志轮转：单文件上限（字节）与保留份数。仅 log_file 非空时生效。
# 默认 104857600(100MiB)/ 5 份。按「一天日志量 × 7」估：
# log_max_size  = 104857600
# log_max_files = 5

# pid 文件。systemd 下不需要（Type=simple 自己跟踪主进程），留空即可。
# 只有 sysvinit / supervisor 才需要。
# pid_file = "/run/gsyncd.pid"

# 状态文件（JSON，原子替换写入）。强烈建议开启：-status 子命令、监控系统、
# 以及「到底同步到哪了」的现场判断全靠它。
status_file = "/var/lib/gsyncd/status.json"

# 目标安全守卫（默认 true）。启动前要求目标已存在，且位于非 / 的挂载点上，
# 或带有 .gsyncd-target marker；否则拒绝启动，避免目标盘未挂载时把数据写进
# 本地根分区。首次挂载目标后执行：
#     gsyncd -config /etc/gsyncd/gsyncd.toml -init-target
# 目标本身就在独立盘/NFS 挂载点下时通常不需要 marker，但 mark 一次也无害。
# target_guard = true

# 状态刷新间隔，默认 10s。每次刷新要序列化整份文档并 rename 一次，
# 别设得太小（<1s 在几十个 sync 时会有可观的无谓 IO）。
status_interval = "10s"

# ---------------------------------------------------------------------------
#  与同机其他服务共处（java / mysql / redis 等）
# ---------------------------------------------------------------------------
# 铺一次 10T 镜像会连续几小时吃满所有核与磁盘。如果这台机器还要对外提供
# 业务，把 gsyncd 排到业务后面，比调任何吞吐参数都有效。
#
# nice：CPU 调度优先级，-20（最优）…19（最差）。常用 10 或 19。
# io_prio：磁盘调度类，idle / best-effort / realtime，可带级别如 best-effort:7。
#          idle 让内核把磁盘带宽优先给同机的其他任务。
#
# 两者都是 best effort：内核或容器拒绝时只记一条警告，同步照常跑。
# 纯备份机 / 专机不需要这两项（零值 = 不动）。
# nice    = 10
# io_prio = "idle"

# 前台运行。由 systemd 托管时必须为 true，否则 gsyncd 会自己 fork+setsid
# 脱离，systemd 会认为主进程已退出（unit 显示 active 但守护进程在别处）。
# 命令行 -nodaemon 等价；deploy/gsyncd.service 已用 -nodaemon 覆盖。
nodaemon = true

# 堆内存上限（字节，或带 k/m/g 后缀）。零值 = 交给 Go runtime 自己决定。
#
# 什么时候要设：这台机器上还有别的服务，而你要一条硬保证 —— 「gsyncd 无论
# 树多大，都不会把内存吃穿」。设了之后 runtime 会在接近上限时更积极地 GC、
# 并把空闲内存还给内核，代价是 CPU 上升一点。
#
# 什么时候不要设：专机跑镜像。此时上限反而会让 runtime 频繁 GC，白白浪费
# CPU 去省一份本来也没人用的内存。
#
# 参考值（用户态实测，见 docs/DESIGN.md §6.2）：
#   每监视一个目录约 42~61 字节（watch 索引）+ 约 100 字节内核不可换出（inotify watch，实测 97~115B）
#   （61B 在 100 万目录处测得，47B 在 2000 万处，42B 在 5000 万处 —— 树越深前缀共享越多）
#   10T / 每目录 100 文件 ≈ 10 万目录 → 用户态约 6MB，内核约 10MB
#   100T 同密度 ≈ 100 万目录 → 用户态约 60MB，内核约 100MB
# 也就是说目录索引本身很小，真正吃内存的是「待处理变更窗口」：实测每个
# 待处理路径约 243 字节 @100 万、215 字节 @2000 万、199 字节 @5000 万（含聚合表与目录节点），
# 默认 max_pending = 500000 时上限约 120MB。两条一起估：
#     常驻 ≈ 目录数 × 60B + max_pending × 243B
# 10T 默认配置约 130MB；100T 默认配置约 180MB。1G 对绝大多数部署绰绰有余，
# 只有把 max_pending 调到百万级时才需要放宽。
# memory_limit = "1g"

# 全局并发传输闸：同时进行的 Apply 批次上限，跨所有 sync 共享。
# 作用不是提速而是限速：防止多个 sync 同时首次全量把磁盘 IO 打满
# （原版 lsyncd 的 issue #75 就是这么把盘拖死的）。
# 默认 8。机械盘阵列建议 2~4；NVMe 可到 16。
max_processes = 8

# 每个 sync 的聚合窗口上限（待处理路径条数），默认 500000。
# 达到上限时不是丢事件，而是立刻把当前窗口冲刷出去（提前发送），
# 然后继续累积 —— 原版这里是硬上限 1000 + 静默丢事件（issue #202/#695）。
# 内存估算：约 199~243 字节/路径（真机 50 万 / 100 万 / 200 万 / 2000 万 / 5000 万五点实测），50 万条 ≈ 120MB。
# 10T 规模遇到「一次性删除几十万文件」时可调到 2000000(≈470MB)。
max_pending = 500000

# 硬上限（默认 2000000）。超过后丢弃新事件并标记 overflow，由全量重同步恢复；
# 这是内存的最终刹车，防止慢目标 + 事件洪峰把进程拖到 OOM。
# max_pending_hard = 2000000

# 轮询后端的扫描间隔。仅 Linux 以外生效（Linux 走 inotify，忽略此项）。
# macOS/Windows/BSD 没有免依赖的递归通知接口，只能整树快照 diff，
# 代价与条目数成正比。默认 30s。百万级目录请调到 5m 以上，否则扫描永不停歇。
# watch_interval = "30s"

# 周期性全量重同步间隔。不写（= 0）时的实际行为分两种：
#   - 所有目录都装上了 watch → 不做周期全量，只靠事件；
#   - 有目录装不上 watch → 自动改成每小时一次，并打这条警告：
#     "N directories could not be watched, falling back to a full resync every hour"
# 写了明确值（如 "6h"）就一律按它跑，与是否装得上 watch 无关；
# 写了 0 与不写等价，无法表达「有目录没装上 watch 也不要全量」。
# 代价：每次全量 = 重新遍历整棵树做 stat。100T 规模下是小时级操作，避开业务高峰。
# full_resync = "6h"

# ============================================================================
#  [[sync]] —— 一个源目录到一个目标的镜像，可以有任意多个。
#  每个 sync 独立拥有自己的聚合窗口、delay 定时器和排除规则。
# ============================================================================

# ----------------------------------------------------------------------------
#  场景 A：本机到本机（推荐，direct 后端，不依赖 rsync/ssh）
# ----------------------------------------------------------------------------
[[sync]]
name   = "data"                     # 日志前缀、status 里的标识。省略时取源目录 basename。
mode   = "direct"                   # direct | rsync | rsyncssh。默认就是 direct。
source = "/srv/data"                # 必须存在且是目录，否则启动即报错。
target = "/backup/data"             # 本地路径。允许不存在（会自动创建）。
                                    # 校验：target 不能在 source 里面，source 也不能在
                                    # target 里面 —— 否则会自我复制直到盘满。

# 静默窗口：最后一次变更之后再等这么久才发一批。默认 15。
#   太小 —— 一次大文件写入被拆成多批，同一文件反复拷贝。
#   太大 —— 目标端延迟高；进程重启时未发出的窗口会丢（状态不持久化）。
#   经验：日常共享盘 5~15s；批量 ETL / 解压落盘 30~60s。
delay  = 15

# 删除语义，四种取值行为完全不同：
#   delete = true        → 真正的镜像。启动清理一次，运行期也持续清理。
#   delete = "startup"   → 只在启动时清理一次，之后源端删了目标端也留着。
#   delete = false       → 只增不删（目标端是超集）。
#   delete = "running"   → 启动时不清（保留目标端已有的额外数据），运行期照常删。
# 默认 true。10T 生产环境请想清楚再开：它意味着源端任何一次误删都会在一批
# 之内镜像到目标端，没有回收站。
delete = true

# 排除规则。rsync 风格通配，同一份列表会在三处生效：
#   1) watcher 层 —— 被排除的目录根本不装 watch（省内核内存与 max_user_watches 配额）
#   2) 事件层     —— 这些路径的变更不进批次
#   3) 传输层     —— 首次全量拷贝也跳过（direct 遍历时 SkipDir；rsync 转 --exclude=）
# 语义要点：
#   * 模式永远用 "/" 分隔；Windows 上收到的 "\" 会被自动归一化。
#   * "cache/" 这类目录模式，除了目录本身，也覆盖它下面的全部内容。
#   * 末尾不带 "/" 的 "cache" 同样匹配名为 cache 的目录及其内容。
#   * 支持 * ? [a-z] [!abc]，以及 "!" 前缀表示 include（覆盖前面的 exclude）。
#   * 列表是后者优先（与 lsyncd 一致）；转发给 rsync 时自动逆序，
#     因为 rsync 是首个命中即停。
#   * 不锚定的模式匹配任意层级（"*.tmp" 匹配 a/b/c.tmp）；
#     以 "/" 开头则锚定到同步根（"/cache/" 只匹配顶层 cache）。
excludes = ["*.tmp", "*.swp", "*~", "/cache/", "/.git/", "node_modules/", "/lost+found/"]

# 拷贝完成后是否对每个文件 fsync。默认 false。
# 默认策略：只对 >= 8MiB 的文件 fsync。理由：
#   完全不刷盘很危险 —— rename 先于数据落盘，断电后会留下 0 字节文件，
#   且下次因 size+mtime 已匹配而被跳过（静默的数据损坏）；
#   但百万个小文件逐个 fsync 比拷贝本身还慢。
# 需要「断电后目标端也绝对完整」时（目标端是唯一备份）设为 true。
fsync = false

# 传输时内容校验（默认 true）：边拷边算 SHA-256，rename 前读回暂存文件复核，
# 不一致自动重拷；verify_retries 是额外重试次数。代价是每个文件多读一遍。
# 全量/抽样深校验用命令行：gsyncd -config ... -verify-content [-verify-sample N]
#                                 gsyncd -config ... -verify-tree
# verify = true
# verify_retries = 2

# 树一直不静默时（有文件被持续写）最多等这么久就强制刷一次。默认 1h。
# 判的是窗口里最老的那条变更，不是逐路径判 —— 所以一个长驻写入方会把同窗口
# 的其他文件一起按这个节奏刷出去（内容正确，只是批次更碎）。
# 0 = 用默认 1h；负值 = 关闭上限，恢复「等到静默才拷」—— 此时持续被追加的
# 文件永远等不到静默期，也就永远不拷，只适合那些确实会停笔的文件。
# max_hold = "1h"

# 等到 writer 关闭文件再同步（issue #458）。默认 false。
#
# 关闭时（默认）：只要事件静默了 delay 秒就算写完。一个被持续追加的文件
#   在写入期间会被 max_hold 强刷几次，每次都是半截快照；writer 关闭时
#   IN_CLOSE_WRITE 再补最后一次，最终内容一致。
# 打开时：判定改为「文件已关闭」。半截快照基本消除，代价是从不关闭的文件
#   （数据库 datafile、mmap 索引、长驻进程持有的句柄）只能靠 max_hold 收敛。
#
# 为什么默认关：这两种失败模式不可比。不开 —— 大文件可能被拷半截，但目标端
#   陈旧是可见的，且 close 时会自愈。开了 —— 从不关闭的文件永远不拷，镜像
#   静默停在旧版本，pending=0 / errors=0 / phase=running 全绿，没有任何日志。
#   所以开启等于声明「这棵树里的文件确实会被关闭」。
#
# max_hold 必须保留（close_write=true 且 max_hold<0 会被直接拒绝）：它是那个
#   「无论如何最终会拷一次」的兜底，也是这个开关唯一的安全边界。
#
# 注意窗口是一起刷的：只要还有一个文件开着，同批次其他已关闭的文件也要等到
#   它关闭或 max_hold 到点。要避免就把常写目录拆成独立的 [[sync]]，给它自己
#   的小 max_hold —— 引擎按最长前缀路由，嵌套 root 下事件只进最长前缀那条。
#
# 只在能报告「文件已关闭」的 watcher 后端上可用（Linux 的 inotify）。轮询后端
#   (macOS/Windows)看不到 close，在它上面开启会在启动时直接报错，而不是静默
#   退化成「只按 max_hold 刷」。
# close_write = true

# 仅 direct 模式：断点续扫记录文件。留空 = 关闭（默认）。
#
# 关掉时，每次启动都要对源端每个目录 readdir、对目标端每个目录 readdir、
# 对每个文件 stat 一次目标端。实测重扫已同步好的 100 万文件 2,336 文件/秒，
# 外推 10T 的 5000 万文件 ≈ 5.9 小时纯扫描（还没传一个字节）。
# 打开后，源端仍然遍历（停机期间的改动只有 stat 看得见），但内容未变的目录
# 完全不碰目标端：不 readdir、不逐文件 stat、不 prune。
#
# "auto" = 落在 status_file / log_file / pid_file 同目录（都没有则 $TMPDIR），
#          文件名 gsyncd-<name>.scan；也可以直接写绝对路径。
#
# 安全边界（重要）：检查点是加速器，不是证据。文件缺失 / 被截断 / CRC 不符 /
# 指纹不符（源、目标、exclude、模式任一变化）/ 路径不可写 —— 每一种都退化成
# 「没有检查点」，多走一遍全量，绝不会少走。一个目录要被跳过，必须同时满足：
#   1) 源目录 mtime、子项数、子项摘要三者都与记录一致；
#   2) 目标目录存在，且其 mtime 等于记录的源目录 mtime
#      (每拷完一个目录，gsyncd 把目标目录 mtime 设成源目录 mtime，与 rsync -a 一致，
#        所以手删目标文件、从旧备份恢复都会让记录当场失效)；
#   3) 检查点指纹匹配。
# 记录只在目录拷完之后才写，所以被杀掉的进程留下的尾部最多少记一批，不会记进
# 没做完的活。可以随时删掉这个文件，下次启动就是一次完整核对。
#
# checkpoint = "auto"

# 该 sync 自己的并发上限（0 = 只受全局 max_processes 约束）。
# 用途：防止一个繁忙的大 sync 占满全局闸，把小而紧急的 sync 饿死。
# 它限的是「同一 sync 同时在飞的传输批次」，对所有后端生效；但 direct 后端
# 每个 sync 本来就一次只跑一批，所以这个键几乎只在 rsync / rsyncssh 下起作用。
# direct 的并行度看下面的 workers，不是这个。
# max_processes = 4

# 仅 direct 模式：并行拷贝的 goroutine 数。0 = min(CPU 核数, 16)，这是默认值。
# 与上面的 max_processes 是两回事 —— 拷贝 goroutine 不 fork、不各自走树，
# 代价低得多，所以两者的合理取值区间完全不同。
# 实测（51 万目录 / 51 万文件的冷目标）：workers=1 用 2m21s，
# workers=2 用 1m18s（1.8 倍），workers=4/8 不再变快，16 反而略慢。
# 结论：默认值已经落在平台期里，通常不需要动；机械盘可降到 2 减少寻道竞争。
# workers = 4

# 仅 direct 模式：初始遍历时提前读目录列表的 goroutine 数。
# 0 = min(CPU 核数, 16)，这是默认值；负数关闭预读，退回串行 filepath.Walk。
# 与 workers 分开是因为它和拷贝 worker 争的是同一块盘：冷启动时读得比拷得快
# 没有意义，磁盘已经跑满的机器上关掉它更划算。
# 冷缓存下串行遍历只有一次元数据请求在飞，磁盘队列是空的：21 万目录实测
# 126s（串行）vs 15.9s（16 路）。访问顺序与 filepath.Walk 逐条一致，
# 所以检查点仍然有效。
# prefetch = 16

# 仅 rsync / rsyncssh 使用：单次 rsync 调用最多带多少条路径。
# 默认 10000。走管道（--files-from=-）不受 ARG_MAX 限制，但太大有害：
# 一次失败就要整批重试。10T 规模建议 2000~10000。
# batch_limit = 10000

# 仅 rsync / rsyncssh 使用：额外透传给 rsync 的参数（原样追加）。
# lsyncd 2.x 的 rsyncOpts 对应这里。
# rsync_extra = ["-z", "--compress-level=1", "--bwlimit=50m"]

# ----------------------------------------------------------------------------
#  场景 B：推送到远端（rsyncssh），需要目标机有 rsync + sshd
#  去掉注释即可启用；mode 与 source/target 必须相应改写。
# ----------------------------------------------------------------------------
# [[sync]]
# name       = "offsite"
# mode       = "rsyncssh"
# source     = "/srv/data"
# target     = "backup@10.0.0.9"     # 只写 host（或 user@host），不要带路径
# target_dir = "/backup/data"        # 远端目标目录单独写这里
# delay      = 30
# delete     = true
# excludes   = ["*.tmp", "/cache/"]
# batch_limit = 5000
# rsync_extra = ["-z"]
#
# [sync.ssh]
# binary        = "ssh"              # 默认 ssh
# port          = 22
# identity_file = "/root/.ssh/id_ed25519_gsyncd"
# # 下面这套 key 渲染成 ssh 的 -o k=v，用于免交互与主机指纹校验。
# # 本行写成双 # 是刻意的：整块去掉一层注释后它必须仍是注释，否则会变成非法配置行。
# [sync.ssh.options]
# BatchMode             = "yes"
# StrictHostKeyChecking = "accept-new"
# ServerAliveInterval   = "30"
# ServerAliveCountMax   = "3"

# ----------------------------------------------------------------------------
#  场景 C：用本机 rsync 拷到另一块盘（需要 ACL / xattr / 稀疏文件时用这个）
#  direct 后端不处理 ACL、xattr、稀疏文件、硬链接 —— 需要这些就换 rsync。
# ----------------------------------------------------------------------------
# [[sync]]
# name   = "data-rsync"
# mode   = "rsync"
# source = "/srv/data"
# target = "/backup/data"
# delay  = 15
# delete = true
# excludes = ["*.tmp"]
# rsync_extra = ["-aHAX", "--numeric-ids", "--sparse"]
