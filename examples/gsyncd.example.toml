# ============================================================================
#  gsyncd 配置模板（TOML 子集）
# ============================================================================
#
#  安装位置建议：/etc/gsyncd/gsyncd.toml      权限：0640 root:root
#
#  首次部署：
#    1. 确认源目录存在、目标盘已挂载
#    2. gsyncd -config /etc/gsyncd/gsyncd.toml -init-target
#    3. gsyncd -config /etc/gsyncd/gsyncd.toml -check
#    4. systemctl start gsyncd     # unit 使用 -nodaemon
#
#  前台调试：
#    gsyncd -config /etc/gsyncd/gsyncd.toml -nodaemon -loglevel debug
#
#  本文件由内置 TOML 子集解析器读取，不支持完整 TOML：
#    - 支持 [table]、[[table]]、[table.sub]、基本类型、字符串、数组（可跨行）
#    - 不支持多行字符串（"""..."""）、日期字面量、表头之外的 dotted key
#    - 未知键会直接报错退出（避免拼写错误静默失效）
#
#  时长：写字符串按 Go duration 解析（"500ms"/"15s"/"2m"/"1h"）；
#        写纯数字按秒解释（delay = 15 等价于 delay = "15s"）。
#
# ============================================================================
#  [global] —— 进程级设置，所有 sync 共享
# ============================================================================
[global]

# 日志文件。留空 = stderr（systemd 下即 journald，生产推荐）。
# 一旦写了文件，日志不再进 journald，排障时要注意。
log_file = ""

# 日志级别：debug | info（也接受 normal）| warn（也接受 scarce）| error | none
log_level = "info"

# 日志轮转：单文件上限（字节）与保留份数。仅 log_file 非空时生效。
log_max_size = 104857600
log_max_files = 5

# pid 文件。systemd 下不需要（Type=simple 自己跟踪主进程），留空即可。
pid_file = ""

# 状态文件（JSON，原子替换）。强烈建议开启：-status、监控和现场判断都靠它。
status_file = "/var/lib/gsyncd/status.json"
status_interval = "10s"

# 全局并发传输闸（跨所有 sync 共享）。
# direct 后端每个 sync 一次只跑一批；这个值主要限制 rsync 子进程并发。
max_processes = 8

# 单 sync 聚合窗口的软上限：达到后立即提前发送，不丢事件。
# 约 243 字节/路径，50 万条约 120MB。
max_pending = 500000

# 聚合窗口硬上限：超过后丢弃新事件并标记 overflow，由全量重同步恢复。
# 这是内存的最终刹车，防止慢目标 + 事件洪峰把进程拖到 OOM。
max_pending_hard = 2000000

# 非 Linux 平台的轮询间隔；Linux 使用 inotify，忽略此项。
watch_interval = "30s"

# 周期性全量重同步间隔。0 = 仅在 watch 装不下时自动启用每小时全量。
# 明确写值则一律按该间隔执行。
full_resync = 0

# Go 堆软上限，支持 k/m/g/t 后缀（如 "1g"）。0 = 不设置。
# 它是软上限：接近时更积极 GC 并归还空闲页，不会因超限杀进程。
memory_limit = 0

# 与同机服务共处：CPU nice 值（-20 最优 … 19 最差）。
nice = 0

# IO 调度类：idle | best-effort | realtime，可带级别，如 best-effort:7。
io_prio = ""

# 目标安全守卫（默认 true）。
# 启动/检查时要求目标已存在，且满足以下之一：
#   - 位于非 "/" 的挂载点（独立盘、NFS 等）
#   - 目标根目录存在 .gsyncd-target marker
# 不满足则拒绝启动。首次挂载目标后执行一次：
#     gsyncd -config /etc/gsyncd/gsyncd.toml -init-target
# 这样可避免目标盘未挂载时把镜像写进本地根分区。
target_guard = true

# ============================================================================
#  场景 A：本地/NFS 挂载点直接镜像（生效示例）
# ============================================================================
[[sync]]

# 日志和状态里的标识；省略时取源目录 basename。
name = "data"

# 后端：
#   direct   —— 进程内拷贝，零外部依赖；目标可以是本地目录或 NFS 挂载点
#   rsync    —— 调用本机 rsync
#   rsyncssh —— 调用 rsync 并通过 ssh 写远端
mode = "direct"

# 被监视的源目录；目标目录。
source = "/srv/data"
target = "/backup/data"

# 事件静默多久后开始传输。整数按秒解释。
delay = 15

# 持续写入（日志/WAL/大文件）导致永不静默时，最多等这么久强制刷一次。
# 0 = 使用默认 1h；负值 = 关闭上限（不推荐，文件可能长期不同步）。
max_hold = "1h"

# 等待 writer 关闭文件后再同步（issue #458）。
# 默认 false：写入期间可能落半截快照，close 后自愈。
# 打开前必须保留 max_hold，作为“永不关闭”的兜底。
close_write = false

# 删除语义：
#   true      —— 启动和运行期都镜像删除
#   false     —— 从不删除
#   "startup" —— 只在首次同步清理一次目标多余项
#   "running" —— 首次不清，之后照删
delete = true

# rsync 风格排除模式。匹配目录时覆盖其全部内容。
# 同一份列表同时作用于 watcher、事件和首次全量。
excludes = [
  "*.tmp",
  "*.swp",
  "/cache/",
  "/.git/",
  "**/node_modules/**",
  "tmp[0-9]",
  "!keep.tmp",
]

# direct 后端并行拷贝 goroutine 数。0 = min(CPU,16)。
workers = 0

# direct 初始遍历预读目录的 goroutine 数。0 = min(CPU,16)；负值关闭预读。
prefetch = 0

# direct 断点续扫记录文件。"" = 关闭；"auto" = 放在 status/log/pid 同目录；
# 也可写绝对路径。记录只加速重启，损坏时自动退回全量核对。
checkpoint = "auto"

# rsync 后端单次调用的最大路径数。
batch_limit = 10000

# direct 模式每个文件 rename 前都 fsync。默认 false：大文件本来就会刷盘，
# 百万小文件逐个 fsync 比拷贝还慢。
fsync = false

# direct 传输时内容校验：边拷边算 SHA-256，rename 前读回暂存文件复核；
# 不一致自动重拷。默认 true。代价是每个文件多读一遍。
# verify_retries 是额外重试次数；仍失败则批次报错。
verify = true
verify_retries = 2

# 该 sync 自己的并发上限；0 = 只用全局 max_processes。
max_processes = 0

# ============================================================================
#  以下两个场景默认注释；需要时整块取消注释即可。
#  测试会取消注释并验证它们可解析。
# ============================================================================

